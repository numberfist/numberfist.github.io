<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>
    {% if page.title %}{{ page.title }} | {% endif %}{{ site.title | default: "Numberfist" }}
  </title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- MathJax for LaTeX equations -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-svg.js"></script>

  <style>
    /* body {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.65;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    } */

    body {
      margin: 0;
      line-height: 1.65;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      max-width: 1000px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    img {
      max-width: 100%;
      height: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 0.6rem 0.8rem;
      text-align: left;
      vertical-align: top;
    }

    th {
      font-weight: 700;
      background: #f5f5f5;
    }

    tr:nth-child(even) {
      background: #fafafa;
    }

    .draft-note {
      border: 1px solid #999;
      padding: 1rem;
      margin: 1.5rem 0;
      background: #f8f8f8;
    }

    .archive-note {
      border-left: 4px solid #999;
      padding-left: 1rem;
      margin: 1.5rem 0;
      font-style: italic;
    }

    .story-intro {
      font-size: 1.25rem;
      line-height: 1.45;
      font-weight: 600;
      margin: 2rem 0;
    }

    .important-notes,
      .important-notes li {
        font-size: 1.0rem;
        line-height: 1.45;
      }

    .gdoc-page.c25 {
      max-width: 850px !important;
      padding: 48px 56px !important;
    }
  </style>
</head>

<body>
  <main>
    {{ content }}
  </main>
</body>
</html>
